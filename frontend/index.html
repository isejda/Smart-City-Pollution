<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart City Pollution</title>
  <meta name="description" content="Rrjet monitorimi i cilësisë së ajrit për Tiranën, Korçën dhe Elbasanin - portali publik dhe paneli i operimit." />
  <meta name="theme-color" content="#081A21" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div id="boot-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#081A21;color:#7ED0C2;font-family:Inter,system-ui,sans-serif">
      <div style="width:34px;height:34px;border:3px solid rgba(126,208,194,.25);border-top-color:#7ED0C2;border-radius:50%;animation:bootspin .8s linear infinite"></div>
      <div style="font-size:12px;font-weight:600;letter-spacing:.14em">SMART CITY POLLUTION</div>
    </div>
  </div>
  <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
